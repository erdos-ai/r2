name: Release

# This workflow is triggered when release-please creates a tag.
# It builds binaries with GoReleaser and updates the install script.

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  pull-requests: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v6
        with:
          go-version: '>=1.24.0'
          cache: true
      - uses: anchore/sbom-action@v0
      - uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  install-script:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - name: Make install script
        run: bash scripts/make-install.sh
      - name: Create PR for install script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add install.sh
          if git diff --staged --quiet; then
            echo "No changes to install script"
            exit 0
          fi
          TAG=$(git describe --tags --abbrev=0)
          BRANCH="chore/update-install-script-${TAG}"
          git checkout -b "$BRANCH"
          git commit -m "chore: update install script for ${TAG}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: update install script for ${TAG}" \
            --body "Auto-generated PR to update install script after ${TAG} release." \
            --base main \
            --head "$BRANCH"
